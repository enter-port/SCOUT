# SCOUT stage-1 self-improvement eval config -- CAN (image pipeline).
# Mirrors configs/eval_square.yaml with can params (horizon 300, core_20).
# Drives `scout/eval/run_round.py` (one SOE round: baseline + guided exploration
# + merge + retrain). Run-specific ckpt paths come via CLI.

seed: 42          # default when run standalone; round.sh derives per-round seeds:
                  # exp N = 4 followed by N '2's (42 / 422 / 4222 / 42222 ...)

base_dp:
  initial_ckpt_path: /root/workspace/baojiachun/scout/data/can/train/DP/DP-base/checkpoints/580.ckpt
  config_name: base_dp_can_image
  config_dir: configs

vib:
  ckpt_path: /root/workspace/baojiachun/scout/data/can/train/dyn/dyn-base/scout_vib.ckpt
  base_dp_ckpt: /root/workspace/baojiachun/scout/data/can/train/DP/DP-base/checkpoints/580.ckpt
  view_names: [agentview_image, robot0_eye_in_hand_image]
  proprio_dim: 9
  proprio_emb_dim: 64
  style_dim: 16
  hidden_dim: 128

dataset:
  path: /root/workspace/baojiachun/scout/data/can/rollout/can_core.hdf5
  core_filter_key: core_20

action_dim: 10

eval:
  n_init_states: 100
  try_times: 5
  horizon: 300                         # robomimic can default
  n_envs: 50                           # parallel env count (single-process vectorized
                                       # rollout; lower if GPU memory / EGL render
                                       # contexts are tight). n_envs==1 -> sequential.
  log_every: 10                        # wandb progress log period (vec ticks)
  view_names: [agentview_image, robot0_eye_in_hand_image]
  proprio_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]

exploration:
  guidance_scale: 5.0
  guidance_start_timestep: 50

self_improvement:
  num_rounds: 6
  scout_aug_mask: scout_aug
  num_epochs: 1500

# ---- wandb (eval progress; real-time baseline/exploration collection) ---
wandb:
  use_wandb: true
  project: scout-eval
  tags: [step2, eval]

device: auto
log_dir: logs/scout_eval_can_image

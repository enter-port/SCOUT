  guidance_start_timestep: 50     # delayed guidance: a0 captured at t49 from the settled x0_hat (clipped-x0 KL-floor fix, R11+ era)
self_improvement:
  num_rounds: 8
  scout_aug_mask: scout_aug
  num_epochs: 1500
wandb:
  use_wandb: true
  project: TOOLHANG-9-1-orbit-s233

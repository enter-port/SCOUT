# SCOUT E0: base Diffusion Policy on robomimic `transport` image (LPB format).
#
# Mirrors configs/base_dp_square_image.yaml with the canonical robomimic
# transport spec (diffusion_policy/config/task/transport_image_abs.yaml):
# dual-arm, 4 cameras (shouldercamera0/1 + robot0/1_eye_in_hand), 18-dim
# proprio (robot0 + robot1), abs_6drot action shape [20] = (3 pos + 6 rot + 1
# gripper) x 2 arms, max_steps 700.
#
# Run via the repo-root LPB entry:
#   python train.py --config-path configs --config-name base_dp_transport_image \
#       task.dataset_path=<transport_core_hdf5> \
#       logging.name=DP-transport-SCOUT-1 logging.project=scout-base-dp
#
# round-0 (E0) uses the core_20 hdf5; the self-improvement loop reuses this
# config with task.dataset_path overridden to a round's augmented hdf5.

name: base_dp_transport_image
_target_: diffusion_policy.workspace.train_diffusion_unet_hybrid_workspace.TrainDiffusionUnetHybridWorkspace

exp_name: "scout_e0"
task_name: transport
dataset_type: ph
abs_action: true
train_filter_key: null     # SCOUT mask knob (SOE convention); ignored by LPB dataset

shape_meta: &shape_meta
  obs:
    shouldercamera0_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    shouldercamera1_image:
      shape: [3, 84, 84]
      type: rgb
    robot1_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eef_pos:     {shape: [3]}
    robot0_eef_quat:    {shape: [4]}
    robot0_gripper_qpos: {shape: [2]}
    robot1_eef_pos:     {shape: [3]}
    robot1_eef_quat:    {shape: [4]}
    robot1_gripper_qpos: {shape: [2]}
  action:
    shape: [20]            # abs_6drot dual-arm: (3 trans + 6 rot + 1 gripper) x 2

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: false
keypoint_visible_rate: 1.0
obs_as_global_cond: true

policy:
  _target_: diffusion_policy.policy.diffusion_unet_hybrid_image_policy.DiffusionUnetHybridImagePolicy

  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: true
    prediction_type: epsilon

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  crop_shape: [76, 76]
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  obs_encoder_group_norm: true
  eval_fixed_crop: true

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# robomimic `transport` image dataset (SOE path layout; override per machine).
# core_20 = pre-extracted core-only hdf5 (SOE ind % 10 == 0 convention).
task:
  name: ${task_name}
  dataset_path: /root/workspace/baojiachun/scout/data/robomimic/transport/ph/image_v141_abs_core20.hdf5
  train_filter_key: ${train_filter_key}
  env_runner:
    _target_: diffusion_policy.env_runner.robomimic_image_runner.RobomimicImageRunner
    dataset_path: ${task.dataset_path}
    shape_meta: *shape_meta
    n_train: 6
    n_train_vis: 2
    train_start_idx: 0
    n_test: 50
    n_test_vis: 4
    test_start_seed: 100000
    max_steps: 700                   # robomimic transport default
    n_obs_steps: ${n_obs_steps}
    n_action_steps: ${n_action_steps}
    render_obs_key: shouldercamera0_image
    fps: 10
    crf: 22
    past_action: ${past_action_visible}
    abs_action: ${abs_action}
    tqdm_interval_sec: 1.0
    n_envs: 28
  dataset:
    _target_: diffusion_policy.dataset.robomimic_replay_image_dataset.RobomimicReplayImageDataset
    shape_meta: *shape_meta
    dataset_path: ${task.dataset_path}
    horizon: ${horizon}
    pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
    pad_after: ${eval:'${n_action_steps}-1'}
    n_obs_steps: ${dataset_obs_steps}
    abs_action: ${abs_action}
    rotation_rep: rotation_6d
    use_legacy_normalizer: false
    use_cache: true
    seed: 42
    val_ratio: 0.02

dataloader:
  batch_size: 64
  num_workers: 0
  shuffle: true
  pin_memory: true
  persistent_workers: false

val_dataloader:
  batch_size: 64
  num_workers: 0
  shuffle: false
  pin_memory: true
  persistent_workers: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: false
  resume: true
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 600
  gradient_accumulate_every: 1
  use_ema: true
  rollout_every: 20
  checkpoint_every: 20
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: diffusion_policy_debug
  resume: true
  mode: online
  name: DP-${task_name}-base           # e.g. DP-transport-base (SCOUT convention)
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: true
  save_last_snapshot: false

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}

seed: 42
# eval_can_entropy.yaml -- FORMAL entropy experiment (user 2026-08-24).
# Copy of eval_can_exp1.yaml with the entropy cost (= 方案三 atypical,
# --guide atypical) calibrated optimum from the entropy_e2e dose-response:
# scale 3.0 / cap 2.5 (CLI --atypical-cap) / full denoise window (gst 100).
# Stale absolute paths below are ALWAYS overridden by run_rollout CLI
# (--base-dp-ckpt / --vib-ckpt / --core-hdf5); dataset.path is the merge
# template source and follows --core-hdf5 (run_rollout.py:197).
base_dp:
  initial_ckpt_path: /root/workspace/baojiachun/scout/data/experiment2/can/train/DP/DP-base/checkpoints/580.ckpt
  config_name: base_dp_can_image
  config_dir: configs
vib:
  ckpt_path: /root/workspace/baojiachun/scout/data/experiment2/can/train/dyn/dyn-base/scout_vib.ckpt
  base_dp_ckpt: /root/workspace/baojiachun/scout/data/experiment2/can/train/DP/DP-base/checkpoints/580.ckpt
  view_names:
  - agentview_image
  - robot0_eye_in_hand_image
  proprio_dim: 9
  proprio_emb_dim: 64
  style_dim: 16
  hidden_dim: 128
dataset:
  path: /root/workspace/baojiachun/scout/data/experiment2/can/rollout/can_core.hdf5
  core_filter_key: core_20
action_dim: 10
eval:
  n_init_states: 100
  try_times: 5
  horizon: 300
  n_envs: 12              # 2026-08-22 user: 25 -> 12 (speed probe: 12 fastest tier, lowest corruption)

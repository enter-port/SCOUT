  guidance_start_timestep: 100    # full denoise window (s3.0 x gst100 = best)
self_improvement:
  num_rounds: 6
  scout_aug_mask: scout_aug
  num_epochs: 1500
wandb:
  use_wandb: true
  project: CAN-8-24-entropy
  tags:
  - formal
  - entropy

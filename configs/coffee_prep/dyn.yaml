# vib_coffee_prep_exp1.yaml -- v3 dyn training template, COFFEE_PREP (2026-09-20).
# COPY of vib_threading_exp1.yaml with ONLY the dataset placeholders pointing
# at the MimicGen coffee_preparation_d0 pool + campaign paths; knobs identical
# (beta 3e-5, free_bits 0.005, failure_weight 1). Cameras: agentview +
# robot0_eye_in_hand (mimicgen pre-rendered 84x84, exact key match). Proprio 9
# (3+4+2), action_dim 10 (abs_6drot single arm). ckp round script overlays at
# runtime: dataset.zarr_path, dataset.feature_cache, model.E_s.base_dp_ckpt,
# seed, cudnn_deterministic, save_dir, wandb.{name,project,minimal}.
seed: 233
dataset:
  # default = real s233 core20 (review P2-1); runtime-overlaid every round
  zarr_path: /root/workspace/baojiachun/scout/data/2026_9_19_coffeeprep_mg_p1/COFFEEPREP-MG-p1-s233/coffee_prep/rollout/coffee_prep_core.hdf5
  view_names:
  - agentview_image
  - robot0_eye_in_hand_image
  abs_action: true
  feature_cache: true
  use_crop: true
  original_img_size: 84
  cropped_img_size: 76
  action_dim: 10
  frameskip: 8
  num_workers: 0
  shape_obs:
    robot0_eef_pos:
      shape:
      - 3
    robot0_eef_quat:
      shape:
      - 4
    robot0_gripper_qpos:
      shape:
      - 2
    agentview_image:
      shape:
      - 3
      - 84
      - 84
      type: rgb
    robot0_eye_in_hand_image:
      shape:
      - 3
      - 84
      - 84
      type: rgb
model:
  E_s:
    base_dp_ckpt: /root/workspace/baojiachun/scout/data/2026_9_19_coffeeprep_mg_p1/COFFEEPREP-MG-p1-s233/coffee_prep/train/DP/DP-base/checkpoints/599.ckpt
    view_names:
    - agentview_image
    - robot0_eye_in_hand_image
    proprio_dim: 9
    proprio_emb_dim: 64
  style_dim: 16
  hidden_dim: 128
beta: 3.0e-05
free_bits: 0.005
failure_weight: 1
optimizer:
  name: AdamW
  params:
    lr: 0.001
    betas:
    - 0.9
    - 0.999
    weight_decay: 1.0e-06
  lr_scheduler: cosine
  warmup_epochs: 5
batch_size: 256
num_epochs: 300
steps_per_epoch: 100
val_ratio: 0.1
val_every: 20
save_dir: /root/workspace/baojiachun/scout/data/2026_9_19_coffeeprep_mg_p1/COFFEEPREP-MG-p1-s233/coffee_prep/train/dyn/dyn-base
use_wandb: true
wandb:
  project: COFFEEPREP-MG-p1-s233
  name: dyn-BASE-round0
  metric_prefix: dyn/

# E1: VIB joint training + β scan on robomimic `lift` low_dim (raw delta actions).
# Run: python -m scout.train_vib --config configs/vib_lift_lowdim.yaml
#
# Loss = next-state MSE + β·KL (no AE / no reconstruction; E_s = identity for
# low_dim). NOTE: data path points at SOE's robomimic dataset. As of Phase 3
# the datasets/ dir is empty (not downloaded) -- the actual E1 β-scan is
# pending data + the SOE conda env (py3.8 / torch 1.13). The training loop
# itself is verified on dummy transitions (see verification script).

seed: 233

dataset:
  # Path relative to the repo root (where scout/ lives). Override per machine.
  path: SOE/simulation/datasets/lift/ph/low_dim_v141.hdf5
  train_filter_key: train      # mask/<key> group in hdf5; use "core_20" for core subset

# state_dim / action_dim are placeholders -- the real values come from the data
# source (RobomimicLowdimSource.state_dim/.action_dim) and are asserted inside
# ScoutVIB. lift low_dim: state_dim≈19 (sum of low-dim obs keys), action_dim=7
# (raw delta: 3 trans + 3 rot + 1 gripper).
state_dim: null
action_dim: null

model:
  modality: low_dim            # 【image 接口点】 set 'image' for stage-2 (NotImplementedError for now)
  style_dim: 16                # VIB skill latent (z); E_s identity -> s_bar_dim = state_dim
  hidden_dim: 128

# β is the make-or-break knob (scout_design.md §7 risk #1). Sweep, then pick
# the largest β with sensitivity_ratio >= ~0.3.
betas: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]

optimizer:
  name: AdamW
  params:
    lr: 1.0e-3
    betas: [0.9, 0.999]
    weight_decay: 1.0e-6

batch_size: 256
num_epochs: 500               # per β; one "epoch" = steps_per_epoch random batches
steps_per_epoch: 200

save_dir: out/vib_lift_lowdim

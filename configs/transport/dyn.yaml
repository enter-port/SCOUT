# vib_transport_exp1.yaml -- v3 dyn training template, TRANSPORT (2026-09-13).
# Copy of vib_tool_hang_exp1.yaml (formal entropy experiment lineage); transport
# dataset placeholders + dual-arm fields only, knobs identical (beta 3e-5,
# free_bits 0.005, failure_weight 1). Cameras: shouldercamera0/1 +
# robot0/1_eye_in_hand (transport has NO agentview). Proprio 18 (robot0+robot1:
# 3+4+2 x 2), action_dim 20 (abs_6drot dual arm, 14 raw -> 20 in the shared
# _convert_robomimic_to_replay).
# round_tp.sh overlays at runtime: dataset.zarr_path, dataset.feature_cache,
# model.E_s.base_dp_ckpt, seed, cudnn_deterministic, save_dir,
# wandb.{name,project,minimal}.
seed: 233
dataset:
  zarr_path: /root/workspace/baojiachun/scout/data/robomimic/transport/ph/image_v141_abs.hdf5
  view_names:
  - shouldercamera0_image
  - robot0_eye_in_hand_image
  - shouldercamera1_image
  - robot1_eye_in_hand_image
  abs_action: true
  feature_cache: true
  use_crop: true
  original_img_size: 84
  cropped_img_size: 76
  action_dim: 20
  frameskip: 8
  num_workers: 0
  shape_obs:
    robot0_eef_pos:
      shape: [3]
    robot0_eef_quat:
      shape: [4]
    robot0_gripper_qpos:
      shape: [2]
    robot1_eef_pos:
      shape: [3]
    robot1_eef_quat:
      shape: [4]
    robot1_gripper_qpos:
      shape: [2]
    shouldercamera0_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    shouldercamera1_image:
      shape: [3, 84, 84]
      type: rgb
    robot1_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
model:
  E_s:
    base_dp_ckpt: /root/workspace/baojiachun/scout/data/2026_9_13_transport/TRANSPORT-s233/transport/train/DP/DP-base/checkpoints/599.ckpt
    view_names: [shouldercamera0_image, robot0_eye_in_hand_image, shouldercamera1_image, robot1_eye_in_hand_image]
    proprio_dim: 18
    proprio_emb_dim: 64
  style_dim: 16
  hidden_dim: 128
beta: 3.0e-05
free_bits: 0.005
failure_weight: 1
optimizer:
  name: AdamW
  params:
    lr: 0.001
    betas: [0.9, 0.999]
    weight_decay: 1.0e-06
  lr_scheduler: cosine
  warmup_epochs: 5
batch_size: 256
num_epochs: 300
steps_per_epoch: 100
val_ratio: 0.1
val_every: 20
save_dir: /root/workspace/baojiachun/scout/data/2026_9_13_transport/TRANSPORT-s233/transport/train/dyn/dyn-base
use_wandb: true
wandb:
  project: TRANSPORT-9-13-orbit-s233
  name: dyn-BASE-round0
  metric_prefix: dyn/
